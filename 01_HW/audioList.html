<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audio List</title>
  <link rel="stylesheet" href="audioList.css" />
</head>
<body>
  <div class="wrap">
    <h1>My Audio Playlist</h1>

    <table class="audio-table">
      <thead>
        <tr>
          <th>Cover</th>
          <th>Title</th>
          <th>Artist</th>
          <th>Year</th>
          <th>Play</th>
          <th>Download</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td><img src="AudioFiles/imagine.jpg" alt="Imagine" class="cover"></td>
          <td>Imagine</td>
          <td>John Lennon</td>
          <td>1971</td>
          <td>
            <audio controls>
              <source src="AudioFiles/imagine.mp3" type="audio/mpeg">
              Your browser does not support the audio element.
            </audio>
          </td>
          <td><a href="AudioFiles/imagine.mp3" download>Download</a></td>
        </tr>

        <tr>
          <td><img src="AudioFiles/bohemian.jpg" alt="Bohemian Rhapsody" class="cover"></td>
          <td>Bohemian Rhapsody</td>
          <td>Queen</td>
          <td>1975</td>
          <td>
            <audio controls>
              <source src="AudioFiles/bohemian.mp3" type="audio/mpeg">
              Your browser does not support the audio element.
            </audio>
          </td>
          <td><a href="AudioFiles/bohemian.mp3" download>Download</a></td>
        </tr>

        <tr>
          <td><img src="AudioFiles/shape.jpg" alt="Shape of You" class="cover"></td>
          <td>Shape of You</td>
          <td>Ed Sheeran</td>
          <td>2017</td>
          <td>
            <audio controls>
              <source src="AudioFiles/shape.mp3" type="audio/mpeg">
              Your browser does not support the audio element.
            </audio>
          </td>
          <td><a href="AudioFiles/shape.mp3" download>Download</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
